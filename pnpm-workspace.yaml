packages:
  - .

# pnpm 9/10 build-script allowlist
onlyBuiltDependencies:
  - "bun"
  - "esbuild"

# pnpm 11+ build-script policy
allowBuilds:
  "bun": true
  "esbuild": true

# pnpm 11.3+: this repository commits and reviews its standalone lockfile.
# Treat that lockfile as the trust base instead of re-applying supply-chain
# policy to every frozen-install entry.
trustLockfile: true
